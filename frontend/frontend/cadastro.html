<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Dev Web II - Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Crie sua Conta</h1>
        <form id="cadastroForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="biografia">Biografia (Opcional):</label>
            <textarea id="biografia" name="biografia"></textarea>

            <label for="avatar_url">URL do Avatar (Opcional):</label>
            <input type="url" id="avatar_url" name="avatar_url">
            
            <button type="submit">Cadastrar</button>
        </form>
        
        <p>Já tem conta? <a href="index.html">Faça login aqui.</a></p>
        
        <p id="mensagemStatus" class="sucesso"></p>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/cadastro.js"></script>
</body>
</html>
